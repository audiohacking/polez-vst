[workspace]
members = [".", "third_party/polez"]
resolver = "2"

[package]
name = "polez-vst"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "polez-vst-standalone"
path = "src/main.rs"
required-features = ["standalone"]

# Scaffolded default: CLAP + VST3 + standalone. To add LV2 / AU / AAX / VST2,
# add the matching feature + optional dep below (e.g.
# `lv2 = ["dep:truce-lv2", "truce/lv2"]` +
# `truce-lv2 = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1", optional = true }`).
# VST2 is a legacy format — the Steinberg VST2 SDK was deprecated in
# 2018 and distributing VST2 plugins may require agreement with
# Steinberg's licensing terms.
# Format features pair `"dep:truce-<format>"` (pulls in the
# wrapper crate) with `"truce/<format>"` (turns on the matching
# feature on the truce umbrella so `truce::<format>_wrapper` is
# in scope and the macro's per-format expansion arm fires).
[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys", "truce/clap"]
vst3 = ["dep:truce-vst3", "truce/vst3"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]

[dependencies]
polez = { path = "third_party/polez", default-features = false }
truce = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1" }
truce-gui = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1" }
truce-clap = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1", optional = true }
truce-vst3 = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1", optional = true }
truce-standalone = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

[dev-dependencies]
truce-test = { git = "https://github.com/truce-audio/truce", tag = "v0.42.1" }

# Custom profile for `cargo truce install --shell`. The shell-mode
# build (`cargo build --profile shell --features ...,shell`) lands the
# shell binary at `target/shell/lib<crate>.dylib`, independent of
# `target/release/` (where regular `cargo build --release` writes) and
# `target/debug/` (where `cargo build` writes). Inherits release for
# DSP perf parity.
[profile.shell]
inherits = "release"
