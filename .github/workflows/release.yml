name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for artifact names (e.g. v0.1.0)"
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            archive: polez-plugins-macos-arm64.zip
            pkg: polez-plugins-macos-installer.pkg
          - os: ubuntu-24.04
            name: linux-x64
            archive: polez-plugins-linux-x64.tar.gz
            pkg: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load Truce version
        run: echo "TRUCE_TAG=$(tr -d '[:space:]' < .github/versions/truce-tag)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
          cache-bin: false

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Cache cargo-truce
        id: cache-cargo-truce
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-truce
          key: cargo-truce-${{ env.TRUCE_TAG }}-${{ runner.os }}

      - name: Install cargo-truce
        if: steps.cache-cargo-truce.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-truce \
            --git https://github.com/truce-audio/truce \
            --tag "${TRUCE_TAG}" \
            --locked

      - name: Build plugin bundles
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo truce build --clap --vst3 --au2
          else
            cargo truce build --clap --vst3
          fi

      - name: Verify bundles exist
        run: chmod +x scripts/verify-bundles.sh && ./scripts/verify-bundles.sh

      - name: Package plugins
        env:
          VERSION: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          mkdir -p dist
          cat > dist/INSTALL.txt <<EOF
          Polez plugin bundles (${{ matrix.name }})
          Version: ${VERSION}

          Install:
            AU v2 → /Library/Audio/Plug-Ins/Components/ (macOS, use .pkg installer)
            CLAP  → ~/.clap/  (macOS/Linux) or system CLAP folder
            VST3  → ~/Library/Audio/Plug-Ins/VST3/ (macOS)
                    ~/.vst3/ (Linux)

          Rescan plugins in your DAW after copying.
          EOF
          cp target/bundles/manifest.toml dist/
          cp -R target/bundles/Polez.clap dist/
          cp -R target/bundles/Polez.vst3 dist/
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R target/bundles/Polez.component dist/
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            (cd dist && zip -r -y "../${{ matrix.archive }}" .)
          else
            tar -C dist -czf "${{ matrix.archive }}" .
          fi
          ls -la "${{ matrix.archive }}"

      - name: Build macOS .pkg installer
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          chmod +x scripts/build-installer-pkg.sh
          ./scripts/build-installer-pkg.sh --version "${VERSION}"
          cp release-artefacts/Polez-macOS-Installer.pkg "${{ matrix.pkg }}"
          test -f "${{ matrix.pkg }}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload macOS installer pkg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release assets
        run: |
          mkdir -p release-upload
          find artifacts -type f \( \
            -name 'polez-plugins-macos-arm64.zip' \
            -o -name 'polez-plugins-macos-installer.pkg' \
            -o -name 'polez-plugins-linux-x64.tar.gz' \
            \) -exec cp {} release-upload/ \;
          echo "Release assets:"
          ls -la release-upload/
          test -f release-upload/polez-plugins-macos-arm64.zip
          test -f release-upload/polez-plugins-macos-installer.pkg
          test -f release-upload/polez-plugins-linux-x64.tar.gz

      - name: Upload to GitHub Release (published event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-upload/*
          fail_on_unmatched_files: true

      - name: Upload to GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: release-upload/*
          fail_on_unmatched_files: true
